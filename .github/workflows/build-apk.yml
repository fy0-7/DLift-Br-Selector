name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Dash-BR-Selector.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dash-BR-Selector
          path: Dash-BR-Selector.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dash BR Selector (latest build)
          body: Download Dash-BR-Selector.apk below and open it on your Android phone to install.
          files: Dash-BR-Selector.apk
          make_latest: true
